name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/quirky-brown-dqrob9]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 브라우저가 예전 파일을 캐시에서 쓰지 않도록, 파일 주소의 ?v=dev 를 커밋 번호로 바꾼다
      - name: Stamp asset versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html js/app.js js/store.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
